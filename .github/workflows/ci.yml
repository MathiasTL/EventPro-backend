name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      # Settings exige secret_key >= 32 caracteres (no hay archivo .env en CI).
      SECRET_KEY: ci-secret-key-para-validacion-de-settings-0123456789
    services:
      # ADR-09: el rate limit de slowapi usa Redis; el runner no trae Redis.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (formato)
        run: ruff format --check .

      - name: Mypy (estricto)
        run: mypy app

      - name: Pytest con cobertura (>= 75%)
        run: pytest -q --cov=app --cov-report=term-missing --cov-fail-under=75
