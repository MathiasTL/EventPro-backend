# Chatwoot como gateway de mensajeria oculto (ver Docs/02-arquitectura/05-spec-chatwoot-gateway.md).
# Archivo opcional: se combina con el compose base y se une a su red `eventpro_network`.
#
#   docker compose -f docker-compose.yml -f docker-compose.chatwoot.yml up -d
#
# (Si se usa la combinacion de desarrollo, agregar tambien -f docker-compose.override.yml.)
#
# Chatwoot usa su propia base de datos y su propio Redis; no comparte `db` ni `redis` de EventPro.
# Configuracion: copiar chatwoot.env.example a chatwoot.env (no versionado) y completar los secretos.
# Base: https://github.com/chatwoot/chatwoot/blob/develop/docker-compose.production.yaml
#
# Preparacion de la base de datos (UNA sola vez, antes del primer arranque de rails/sidekiq;
# tambien tras cada cambio de version de la imagen, para aplicar migraciones):
#
#   docker compose -f docker-compose.yml -f docker-compose.chatwoot.yml \
#     run --rm chatwoot-rails bundle exec rails db:chatwoot_prepare
#
# Para actualizar Chatwoot: cambiar la version fijada abajo, ejecutar el comando anterior y recrear
# los servicios `chatwoot-rails` y `chatwoot-sidekiq`.

x-chatwoot-base: &chatwoot-base
  # Version fijada (no usar `latest`). Imagen multi-arquitectura: linux/amd64 y linux/arm64.
  image: chatwoot/chatwoot:v4.18.0
  env_file: chatwoot.env
  environment: &chatwoot-environment
    NODE_ENV: production
    RAILS_ENV: production
    INSTALLATION_ENV: docker
  volumes:
    - chatwoot_storage:/app/storage
  networks:
    - eventpro_network

services:
  chatwoot-rails:
    <<: *chatwoot-base
    container_name: eventpro_chatwoot_rails
    restart: unless-stopped
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]
    depends_on:
      chatwoot-db:
        condition: service_healthy
      chatwoot-redis:
        condition: service_healthy
    # Unico puerto publicado, solo en loopback: permite entrar a la administracion de Chatwoot
    # (configuracion inicial, bandejas, Agent Bot) y apuntar un tunel local (ngrok) en desarrollo.
    # En el servidor se accede por tunel SSH; la administracion nunca se expone en internet.
    # El valor por defecto es 3001 para no chocar con el frontend de EventPro (3000).
    ports:
      - "127.0.0.1:${CHATWOOT_LOCAL_PORT:-3001}:3000"
    healthcheck:
      # `/api` devuelve la version de Chatwoot; la imagen es Alpine (wget de BusyBox).
      # Con FORCE_SSL=true Rails redirige HTTP a HTTPS: la cabecera simula el proxy TLS.
      # 127.0.0.1 y no localhost: en la imagen localhost resuelve a ::1 y Rails escucha solo IPv4.
      test: ["CMD-SHELL", "wget -qO- --header 'X-Forwarded-Proto: https' http://127.0.0.1:3000/api >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s

  chatwoot-sidekiq:
    <<: *chatwoot-base
    container_name: eventpro_chatwoot_sidekiq
    restart: unless-stopped
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    depends_on:
      chatwoot-db:
        condition: service_healthy
      chatwoot-redis:
        condition: service_healthy
    # Sin healthcheck propio (como `worker` en el compose base).
    healthcheck:
      disable: true

  chatwoot-db:
    # PostgreSQL 16 con la extension pgvector, requerida por Chatwoot.
    image: pgvector/pgvector:pg16
    container_name: eventpro_chatwoot_db
    restart: unless-stopped
    # Lee POSTGRES_USER, POSTGRES_PASSWORD y POSTGRES_DB de chatwoot.env.
    env_file: chatwoot.env
    volumes:
      - chatwoot_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - eventpro_network

  chatwoot-redis:
    image: redis:7-alpine
    container_name: eventpro_chatwoot_redis
    restart: unless-stopped
    env_file: chatwoot.env
    command: ["sh", "-c", "redis-server --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - chatwoot_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - eventpro_network

volumes:
  chatwoot_storage:
  chatwoot_postgres_data:
  chatwoot_redis_data:

networks:
  eventpro_network:
    driver: bridge
