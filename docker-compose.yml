services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eventpro_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - PORT=8000
      - DEBUG=true
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=eventpro_user
      - POSTGRES_PASSWORD=eventpro_secret_password
      - POSTGRES_DB=eventpro_db
      - DATABASE_URL=postgresql+asyncpg://eventpro_user:eventpro_secret_password@db:5432/eventpro_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
    volumes:
      - .:/app
      - uploads_volume:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - eventpro_network

  db:
    image: postgres:16-alpine
    container_name: eventpro_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: eventpro_user
      POSTGRES_PASSWORD: eventpro_secret_password
      POSTGRES_DB: eventpro_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventpro_user -d eventpro_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - eventpro_network

  redis:
    image: redis:7-alpine
    container_name: eventpro_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - eventpro_network

volumes:
  postgres_data:
  redis_data:
  uploads_volume:

networks:
  eventpro_network:
    driver: bridge
